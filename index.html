<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudVault File Manager</title><link rel="stylesheet" href="style.css"></head><body><header><h1>CloudVault File Manager</h1><p>Student portfolio demo — no real files are uploaded or stored.</p></header><main><section class="notice">Demo only: authentication, permissions and security controls are simulated. Do not use real confidential data.</section><div class="grid"><article><h2>My Files</h2><input id="search" placeholder="Search files"><ul id="files"></ul></article><article><h2>Upload demo file</h2><input id="fileName" placeholder="File name"><select id="access"><option>Private</option><option>Shared</option></select><button onclick="addFile()">Add demo file</button><h2>Security Centre</h2><label><input type="checkbox" onchange="score()"> MFA enabled</label><label><input type="checkbox" onchange="score()"> Strong password</label><label><input type="checkbox" onchange="score()"> Backup enabled</label><p id="score">Security score: 0/3</p></article></div></main><script src="script.js"></script></body></html>
